name: Newsletter Health Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live newsletter readiness
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error --max-time 20 https://letmeteachyouai.com/api/newsletter-health)"
          # HTTP 200 alone is insufficient: the health endpoint can return
          # {"ok":true,"newsletter":{"ready":false}} when Brevo is unavailable.
          # Print only a status, never the JSON response or account details.
          printf '%s\n' "$response" | python3 -c 'import json,sys; data=json.load(sys.stdin); details=data.get("newsletter",{}) if isinstance(data,dict) else {}; ready=isinstance(details,dict) and details.get("provider")=="brevo" and details.get("ready") is True; print("Brevo readiness:", "PASS" if ready else "FAIL"); sys.exit(0 if ready else 1)'
