name: Newsletter Health Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live newsletter configuration
        run: |
          set -euo pipefail
          echo 'LIVE_NEWSLETTER_HEALTH_BEGIN'
          curl -L --fail --silent --show-error --max-time 20 https://letmeteachyouai.com/api/newsletter-health
          echo
          echo 'LIVE_NEWSLETTER_HEALTH_END'

      - name: Test production subscribe endpoint
        run: |
          set -euo pipefail
          EMAIL='khewitt1985+lmtyai-api-final-20260818@gmail.com'
          echo "TEST_EMAIL=$EMAIL"
          echo 'SUBSCRIBE_API_BEGIN'
          curl -L --silent --show-error --max-time 20 \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"firstName\":\"Launch Test\",\"company\":\"\"}" \
            -w '\nHTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' \
            https://letmeteachyouai.com/api/subscribe
          echo 'SUBSCRIBE_API_END'
