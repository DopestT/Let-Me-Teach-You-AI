name: Newsletter Health Check

on:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check live newsletter configuration
        run: |
          set -euo pipefail
          echo 'LIVE_NEWSLETTER_HEALTH_BEGIN'
          curl -L --fail --silent --show-error --max-time 20 https://letmeteachyouai.com/api/newsletter-health
          echo
          echo 'LIVE_NEWSLETTER_HEALTH_END'

      - name: List Beehiiv automations
        run: |
          set -euo pipefail
          echo 'BEEHIIV_AUTOMATIONS_BEGIN'
          curl -L --fail --silent --show-error --max-time 20 https://letmeteachyouai.com/api/newsletter-automations
          echo
          echo 'BEEHIIV_AUTOMATIONS_END'
