name: Send Approved AI Ledger Issue

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/send-approved-newsletter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Send, verify, and persist result
        shell: bash
        run: |
          set -u
          url="https://letmeteachyouai.com/api/newsletter-send-approved"
          approval_file="automation/newsletter-approval.json"
          diagnostic_file="automation/newsletter-send-last.json"
          send_body=''
          send_http=''
          verify_body=''
          verify_http=''
          post_id=''
          post_status=''
          web_url=''
          final_error=''
          outcome='failed'

          for attempt in $(seq 1 12); do
            echo "SEND_ATTEMPT=$attempt"
            response="$(curl --silent --show-error --max-time 35 -w $'\nHTTP_STATUS=%{http_code}' "$url" 2>&1 || true)"
            send_http="$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS=//p' | tail -1)"
            send_body="$(printf '%s\n' "$response" | sed '/^HTTP_STATUS=/d')"
            echo "HTTP_STATUS=${send_http:-unknown}"
            echo "$send_body"

            if printf '%s' "$send_body" | jq -e '.ok == true' >/dev/null 2>&1; then
              post_id="$(printf '%s' "$send_body" | jq -r '.post.id // .created.data.id // empty')"
              break
            fi

            stage="$(printf '%s' "$send_body" | jq -r '.stage // empty' 2>/dev/null || true)"
            if [[ "$stage" == "beehiiv_create" || "$stage" == "dedupe_lookup" || "$stage" == "configuration" ]]; then
              final_error="${stage}: $(printf '%s' "$send_body" | jq -c '.' 2>/dev/null || printf '%s' "$send_body")"
              break
            fi
            sleep 5
          done

          if [[ -z "$post_id" ]]; then
            if [[ -z "$final_error" ]]; then
              final_error="sender_no_post_id: ${send_body}"
            fi
          else
            verify_url="${url}?post_id=${post_id}"
            for attempt in $(seq 1 15); do
              echo "VERIFY_ATTEMPT=$attempt"
              response="$(curl --silent --show-error --max-time 35 -w $'\nHTTP_STATUS=%{http_code}' "$verify_url" 2>&1 || true)"
              verify_http="$(printf '%s\n' "$response" | sed -n 's/^HTTP_STATUS=//p' | tail -1)"
              verify_body="$(printf '%s\n' "$response" | sed '/^HTTP_STATUS=/d')"
              echo "HTTP_STATUS=${verify_http:-unknown}"
              echo "$verify_body"

              if printf '%s' "$verify_body" | jq -e --arg id "$post_id" '.ok == true and .post.id == $id' >/dev/null 2>&1; then
                post_status="$(printf '%s' "$verify_body" | jq -r '.post.status // empty')"
                web_url="$(printf '%s' "$verify_body" | jq -r '.post.web_url // empty')"
                break
              fi

              if printf '%s' "$verify_body" | jq -e '.processing == true' >/dev/null 2>&1; then
                sleep 4
                continue
              fi

              stage="$(printf '%s' "$verify_body" | jq -r '.stage // empty' 2>/dev/null || true)"
              if [[ "$stage" == "post_status" && "${verify_http:-}" != "202" ]]; then
                final_error="post_status: $(printf '%s' "$verify_body" | jq -c '.' 2>/dev/null || printf '%s' "$verify_body")"
                break
              fi
              sleep 4
            done

            if [[ "$post_status" == "confirmed" ]]; then
              outcome='sent'
              final_error=''
            elif [[ -z "$final_error" ]]; then
              final_error="unexpected_post_status:${post_status:-unknown}"
            fi
          fi

          recorded_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          jq -n \
            --arg outcome "$outcome" \
            --arg recorded_at "$recorded_at" \
            --arg post_id "$post_id" \
            --arg post_status "$post_status" \
            --arg web_url "$web_url" \
            --arg send_http "$send_http" \
            --arg verify_http "$verify_http" \
            --arg error "$final_error" \
            --arg send_body "$send_body" \
            --arg verify_body "$verify_body" \
            '{outcome:$outcome, recorded_at:$recorded_at, post_id:$post_id, post_status:$post_status, web_url:$web_url, send_http:$send_http, verify_http:$verify_http, error:$error, send_body:$send_body, verify_body:$verify_body}' \
            > "$diagnostic_file"

          tmp="$(mktemp)"
          if [[ "$outcome" == "sent" ]]; then
            jq \
              --arg id "$post_id" \
              --arg sent_at "$recorded_at" \
              --arg web_url "$web_url" \
              '.beehiiv_post_id = $id
               | .sent_at = $sent_at
               | .beehiiv_web_url = $web_url
               | .status = "sent"
               | .ready_to_send = false
               | .error = ""
               | .notes = "Direct Beehiiv Send API accepted the approved branded issue and the returned post was verified with status confirmed. The fragile n8n send dependency was bypassed."' \
              "$approval_file" > "$tmp"
          else
            jq \
              --arg error "$final_error" \
              --arg id "$post_id" \
              '.beehiiv_post_id = (if $id == "" then .beehiiv_post_id else $id end)
               | .status = "send_failed"
               | .ready_to_send = false
               | .error = $error
               | .notes = "Direct send attempt failed. See automation/newsletter-send-last.json for the exact upstream response."' \
              "$approval_file" > "$tmp"
          fi
          mv "$tmp" "$approval_file"

          git config user.name "AI Ledger Send Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$approval_file" "$diagnostic_file"
          git commit -m "Record AI Ledger Beehiiv send outcome" || true
          git push || true

          if [[ "$outcome" != "sent" ]]; then
            echo "NEWSLETTER_SEND_FAILED: $final_error" >&2
            exit 1
          fi

          echo "NEWSLETTER_SEND_VERIFIED: $post_id"
